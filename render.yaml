services:
  - type: web
    name: instanote
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from src.admin_panel import run_admin_panel; run_admin_panel(host='0.0.0.0', port=8080)"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ADMIN_PASSWORD
        value: "render-admin-password"
      - key: SECRET_KEY
        value: "render-secret-key-change-me"
      - key: DB_PATH
        value: "instanote.db"
      - key: LOG_FILE
        value: "instanote.log"
      - key: LOG_LEVEL
        value: "INFO"